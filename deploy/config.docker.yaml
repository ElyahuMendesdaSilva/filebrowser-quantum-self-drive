http:
  port: 8080
  baseURL: "/"
  # externalUrl: "http://localhost:3000"   # opcional: usado nos links de compartilhamento

server:
  logging:
    - levels: "info|error|warning"
      apiFilter: 'disabled'
  sources:
    - path: "/srv"   # pasta de arquivos (montada em FILES_DIR no docker-compose)
      config:
        defaultEnabled: true
        defaultUserScope: "/"
        private: false
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true

auth:
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false
    passkey:
      enabled: false

userDefaults:
  account:
    permissions:
      api: false
      admin: false
      share: true
      realtime: false
